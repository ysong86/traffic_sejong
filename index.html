:root{--sh-bg:#f4f6f8;--sh-panel:#ffffff;--sh-line:rgba(16,42,70,.12);

html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--sh-bg);

.sh-tabs{display:flex;gap:2px;align-items:stretch}
.sh-tab{border:0;border-bottom:3px solid transparent;background:none;

        color:var(--sh-ink2);font:inherit}
.sh-tab b{display:block;font-size:14px;font-weight:700}
.sh-tab span{display:block;font-size:11.5px;color:var(--sh-ink3)}
.sh-tab:hover{background:var(--sh-bg)}
.sh-tab[aria-selected="true"]{border-bottom-color:var(--sh-accent);color:var(--sh-ink)}
.sh-tab[aria-selected="true"] b{color:var(--sh-accent)}
#sh-frames{flex:1;min-height:0;position:relative}
#sh-frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;
                  background:var(--sh-bg)}
#sh-frames iframe[hidden]{display:none}
#sh-wait{position:absolute;inset:0;display:none;align-items:center;
         justify-content:center;color:var(--sh-ink3);font-size:14px}

<script>
(function(){
"use strict";
var TABS = JSON.parse(document.getElementById("sh-meta").textContent);
var box = document.getElementById("sh-frames"), wait = document.getElementById("sh-wait");
var frames = {}, busy = 0;
var store = {
  get: function(k){ try{ return localStorage.getItem("traffic:" + k); }catch(e){ return null; } },
  set: function(k, v){ try{ localStorage.setItem("traffic:" + k, v); }catch(e){} }
};
document.getElementById("sh-tabs").innerHTML = TABS.map(function(t){
  return '<button class="sh-tab" type="button" role="tab" data-t="' + t.id +
         '" aria-selected="false"><b>' + t.title + '</b><span>' + t.sub + '</span></button>';
}).join("");
var btns = Array.prototype.slice.call(document.querySelectorAll(".sh-tab"));

function html(id){
  var b64 = document.getElementById("sh-" + id).textContent.trim();
  var bytes = Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); });
  return new Response(new Blob([bytes]).stream()
           .pipeThrough(new DecompressionStream("gzip"))).text();
}
// 탭 안에서 화면 밝기를 바꾸면 틀과 다른 탭도 따라가게 한다. 안 그러면
// 탭을 옮길 때마다 배경이 번쩍인다.
function syncTheme(frame){
  var doc = frame.contentDocument; if (!doc) return;
  new MutationObserver(function(){
    var v = doc.documentElement.getAttribute("data-theme");
    if (v){ document.documentElement.setAttribute("data-theme", v); store.set("theme", v); }
  }).observe(doc.documentElement, {attributes:true, attributeFilter:["data-theme"]});
}
var saved = store.get("theme");
if (saved) document.documentElement.setAttribute("data-theme", saved);

function show(id){
  btns.forEach(function(b){ b.setAttribute("aria-selected", String(b.dataset.t === id)); });
  Object.keys(frames).forEach(function(k){ frames[k].hidden = (k !== id); });
  store.set("tab", id);
  if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
  var meta = TABS.filter(function(t){ return t.id === id; })[0];
  document.title = meta.title + " · 세종시 교통안전 읽기";
  if (frames[id]) return;
  var me = ++busy;
  wait.style.display = "flex";
  html(id).then(function(text){
    var f = document.createElement("iframe");
    f.title = meta.title;
    frames[id] = f; box.appendChild(f);
    var d = f.contentDocument; d.open(); d.write(text); d.close();
    syncTheme(f);
    if (me === busy) wait.style.display = "none";
    var on = btns.filter(function(b){ return b.getAttribute("aria-selected") === "true"; })[0];
    Object.keys(frames).forEach(function(k){ frames[k].hidden = (on.dataset.t !== k); });
  });
}
btns.forEach(function(b){ b.onclick = function(){ show(b.dataset.t); }; });
addEventListener("hashchange", function(){
  var h = location.hash.slice(1);
  if (TABS.some(function(t){ return t.id === h; })) show(h);
});
var h0 = location.hash.slice(1);
show(TABS.some(function(t){ return t.id === h0; }) ? h0 : TABS[0].id);
})();
</script>
</body></html>
